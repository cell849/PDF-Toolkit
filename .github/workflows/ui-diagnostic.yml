name: Temporary Windows layout diagnostic
on:
  push:
    branches: [release/v0.8.3]
jobs:
  layout:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Offscreen Windows layouts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_inspector_layout.py -q --timeout=60
      - name: Native Windows layouts at 150%
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
        run: python -m pytest tests/test_inspector_layout.py -q --timeout=60
