name: Windows package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional new release tag (e.g. v0.2.1)
        required: false
        type: string
      signing_mode:
        description: Signing mode (self-signed remains an untrusted publisher)
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - self-signed
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install local verification and conversion engines
        shell: pwsh
        run: |
          choco install qpdf exiftool poppler tesseract ffmpeg libreoffice-fresh -y --no-progress --execution-timeout=600
          if ($LASTEXITCODE -ne 0) { throw 'Test engine installation failed.' }
          Import-Module "$env:ChocolateyInstall/helpers/chocolateyProfile.psm1"
          refreshenv
          $env:PATH -split ';' | Where-Object { $_ } | Add-Content $env:GITHUB_PATH
      - run: '& "$env:pythonLocation/python.exe" -m venv .venv'
      - run: ./.venv/Scripts/python.exe -m pip install -e ".[dev,media]"
      - run: ./.venv/Scripts/python.exe -m ruff check .
      - run: ./.venv/Scripts/python.exe -m ruff format --check .
      - name: Native Windows UI workflows at 150% display scale
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
        run: ./.venv/Scripts/python.exe packaging/verify_ui.py
      - name: Capture native inspector and size-unit menu
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
        run: ./.venv/Scripts/python.exe packaging/capture_inspector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-UI-evidence
          path: ui-evidence/
          if-no-files-found: warn
      - name: Run tests
        timeout-minutes: 8
        run: ./.venv/Scripts/python.exe -m pytest -q --timeout=60
      - shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          SIGNING_MODE: ${{ inputs.signing_mode || 'unsigned' }}
        run: |
          ./packaging/build_windows.ps1 -SigningMode $env:SIGNING_MODE -EphemeralSelfSignedCertificate:($env:SIGNING_MODE -eq 'self-signed')
      - name: Reject a tampered self-signed executable
        if: inputs.signing_mode == 'self-signed'
        shell: pwsh
        run: |
          $app = 'dist/LocalPDFToolkit/LocalPDFToolkit.exe'
          $tampered = Join-Path $env:RUNNER_TEMP 'LocalPDFToolkit-tampered.exe'
          try {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $app))
            $pe = [BitConverter]::ToInt32($bytes, 60)
            $section = $pe + 24 + [BitConverter]::ToUInt16($bytes, $pe + 20)
            $rawData = [BitConverter]::ToUInt32($bytes, $section + 20)
            $bytes[$rawData] = $bytes[$rawData] -bxor 1
            [IO.File]::WriteAllBytes($tampered, $bytes)
            $rejected = $false
            try {
              ./packaging/verify_windows_signature.ps1 -AppPath $tampered -CertificatePath dist/LocalPDFToolkit/LocalPDFToolkit-signing.cer
            } catch {
              if ($_.Exception.Message -notmatch '0x80096010') { throw }
              $rejected = $true
            }
            if (-not $rejected) { throw 'Signature verification accepted a modified executable.' }
            Write-Output 'Tampered executable correctly rejected with TRUST_E_BAD_DIGEST.'
          } finally {
            Remove-Item -LiteralPath $tampered -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDFToolkit-Windows-x64
          path: |
            dist/LocalPDFToolkit-Windows-x64.zip
            dist/LocalPDFToolkit-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish Windows download
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a version tag such as v0.2.1.' }
          # Only publish the commit that passed the separate Linux and Windows checks.
          $checksPassed = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $json = gh run list --workflow checks.yml --commit $env:GITHUB_SHA --limit 20 --json status,conclusion,event
            if ($LASTEXITCODE -ne 0) { throw 'Could not query required checks.' }
            $checks = @($json | ConvertFrom-Json | Where-Object { $_.event -eq 'push' })
            if ($checks.Count -gt 0 -and $checks[0].status -eq 'completed') {
              if ($checks[0].conclusion -ne 'success') { throw 'Required Checks workflow failed.' }
              $checksPassed = $true
              break
            }
            Start-Sleep -Seconds 20
          }
          if (-not $checksPassed) { throw 'Required Checks workflow did not complete in time.' }
          gh release create $env:RELEASE_TAG dist/LocalPDFToolkit-Windows-x64.zip dist/LocalPDFToolkit-Windows-x64.zip.sha256 --target $env:GITHUB_SHA --title "Local PDF Toolkit $env:RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
