name: Windows package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional new release tag (e.g. v0.2.1)
        required: false
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install local verification and conversion engines
        shell: pwsh
        run: |
          choco install qpdf exiftool poppler tesseract ffmpeg libreoffice-fresh -y --no-progress --execution-timeout=600
          if ($LASTEXITCODE -ne 0) { throw 'Test engine installation failed.' }
          Import-Module "$env:ChocolateyInstall/helpers/chocolateyProfile.psm1"
          refreshenv
          $env:PATH -split ';' | Where-Object { $_ } | Add-Content $env:GITHUB_PATH
      - run: python -m venv .venv
      - run: ./.venv/Scripts/python.exe -m pip install -e ".[dev,media]"
      - run: ./.venv/Scripts/python.exe -m ruff check .
      - run: ./.venv/Scripts/python.exe -m ruff format --check .
      - name: Run tests
        timeout-minutes: 5
        run: ./.venv/Scripts/python.exe -m pytest -vv --maxfail=1 --timeout=60
      - shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDFToolkit-Windows-x64
          path: dist/LocalPDFToolkit-Windows-x64.zip
          if-no-files-found: error

      - name: Publish Windows download
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a version tag such as v0.2.1.' }
          gh release create $env:RELEASE_TAG dist/LocalPDFToolkit-Windows-x64.zip --target $env:GITHUB_SHA --title "Local PDF Toolkit $env:RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
