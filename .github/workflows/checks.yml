name: Checks
on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python -m pip install -e ".[dev,media]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Run tests
        timeout-minutes: 5
        run: python -m pytest -q --maxfail=1 --timeout=60
      - run: python -m build
